# Web app static-file server (consumed by the reverse proxy).
# Vite emits hashed assets to /assets/ and index.html at the root.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: client-side routes (/o/:org/..., /login, /f/:token)
    # must resolve to index.html on refresh or direct hit.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite content-hashes these → safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
