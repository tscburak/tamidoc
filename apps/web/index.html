<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/ico" href="/favico.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Primary meta -->
    <title>TamiDoc — Document Infrastructure Platform | Templates, PDF Import & API</title>
    <meta
      name="description"
      content="Design a document once, use it everywhere. TamiDoc turns your PDFs into versioned templates fillable via form UI, JSON, REST API, or AI agents."
    />
    <meta name="keywords" content="document management, PDF import, document templates, form builder, API document generation, versioned documents" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="TamiDoc" />
    <meta name="theme-color" content="#D1744B" />
    <link rel="canonical" href="https://tamidoc.co/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TamiDoc" />
    <meta property="og:title" content="TamiDoc — Document Infrastructure Platform" />
    <meta
      property="og:description"
      content="Design a document once, then use it everywhere — as a form, API, PDF, or AI tool. Versioned, reliable, and ready for every consumer."
    />
    <meta property="og:url" content="https://tamidoc.co/" />
    <meta property="og:image" content="https://tamidoc.co/og.png" />
    <meta property="og:image:width" content="1536" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="TamiDoc — Document infrastructure platform" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TamiDoc — Document Infrastructure Platform" />
    <meta
      name="twitter:description"
      content="Design a document once, then use it everywhere — as a form, API, PDF, or AI tool."
    />
    <meta name="twitter:image" content="https://tamidoc.co/og.png" />
    <meta name="twitter:image:alt" content="TamiDoc — Document infrastructure platform" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "TamiDoc",
        "url": "https://tamidoc.co",
        "description": "Document Infrastructure Platform — design a document once, use it everywhere. Versioned templates fillable via form UI, JSON, REST API, or AI agents.",
        "publisher": {
          "@type": "Organization",
          "name": "TamiDoc",
          "logo": {
            "@type": "ImageObject",
            "url": "https://tamidoc.co/logo.svg"
          }
        },
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://tamidoc.co/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
