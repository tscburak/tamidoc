# Tamidoc reverse proxy — the single entry point.
#
# /api/ → NestJS API (includes /api/docs Swagger UI)
# /     → web app static nginx (SPA)
#
# Included at http {} context (conf.d/default.conf), so top-level
# `map` and `upstream` directives are valid here.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream tamidoc_api {
    server api:3000;
}

upstream tamidoc_web {
    server web:80;
}

server {
    listen 80;
    server_name _;

    # Templates embed images as base64 data URLs (apps/api/src/main.ts
    # raises the body limit to 10mb). Give headroom for PDF imports too.
    client_max_body_size 20m;

    # Preserve the real client for the API (rate limiting, logs, OAuth).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # API + Swagger (/api/docs) → API.
    # No trailing slash on proxy_pass → original URI is preserved, so
    # /api/v1/health reaches api:3000/api/v1/health as the app expects.
    location /api/ {
        proxy_pass http://tamidoc_api;
    }

    # SPA + hashed static assets → web nginx.
    location / {
        proxy_pass http://tamidoc_web;
    }
}
